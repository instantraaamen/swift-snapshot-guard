# The Xcode project is generated from this file with XcodeGen:
#   xcodegen generate
name: SnapshotGuardExample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-snapshot-guard:
    path: ../..
targets:
  SnapshotGuardExample:
    type: application
    platform: iOS
    sources: [SnapshotGuardExample]
    info:
      path: SnapshotGuardExample/Info.plist
      properties:
        CFBundleDisplayName: Snapshot Guard Example
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SnapshotGuardExample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - SnapshotGuardExampleTests
  # Images of views are drawn through a window, so the tests are hosted by the application.
  SnapshotGuardExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotGuardExampleTests
        # The references are read from the checkout, next to the source file.
        excludes: ["**/__Snapshots__"]
    dependencies:
      - target: SnapshotGuardExample
      - package: swift-snapshot-guard
        product: SnapshotGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SnapshotGuardExampleTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
